<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyShip — Scan</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="appbar"></header>
  <div class="container">
    <div class="scan-hero">
      <div class="card scan-card">
        <!-- Station bar: the per-station context (store + Auto Mode) lives in a
             slim strip above the scan box instead of a settings section below it. -->
        <div class="station-bar">
          <div class="station-group">
            <span class="station-label">Store</span>
            <select id="source-select" class="station-select" aria-label="Store or database"></select>
          </div>
          <div class="station-group station-auto">
            <label class="switch switch-bar">
              <input type="checkbox" id="auto-mode">
              <span class="switch-track" aria-hidden="true"></span>
              <span class="station-label">Auto Mode</span>
            </label>
            <button type="button" class="station-summary" id="auto-summary" style="display:none"
                    aria-controls="auto-preset" aria-expanded="false"></button>
          </div>
        </div>
        <div id="auto-preset" class="auto-preset" style="display:none">
          <div class="auto-preset-grid">
            <div class="field" id="auto-carrier-field"><label>Carrier</label><select id="auto-carrier"></select></div>
            <div class="field" id="auto-service-field"><label>Service</label><select id="auto-service"></select></div>
            <div class="field" id="auto-service-name-field" style="display:none"><label>Service name</label><input id="auto-service-name" placeholder="e.g. UPS Ground"></div>
            <div class="field"><label>Box</label><select id="auto-box"></select></div>
          </div>
          <div class="auto-status" id="auto-status"></div>
        </div>

        <div class="scan-body">
        <div class="scan-head">
          <div>
            <h1>Scan an order</h1>
            <p class="scan-sub">Scan or type the order / invoice number, then press <kbd>Enter</kbd></p>
          </div>
        </div>

        <div class="scan-input-group">
          <span class="scan-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M16 7v10"/></svg></span>
          <input id="order-number" autocomplete="off" placeholder="Scan order…" aria-label="Order or invoice number">
          <button class="btn btn-primary" id="lookup-btn">Look up</button>
        </div>
        <div class="scan-status" id="lookup-status"></div>
        </div>
      </div>
    </div>
    <div class="scan-links">
      <span id="orders-link" style="display:none">Browse open orders on the <a href="/orders.html">Orders</a> page, or create</span><span id="orders-link-alt">Create</span> a <a href="/ship.html?source=manual">manual shipment</a>.
    </div>
  </div>
  <div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal"></div></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/scan.js"></script>
</body>
</html>
