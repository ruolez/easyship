<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyShip — Scan</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="appbar"></header>
  <div class="container">
    <div class="scan-hero">
      <div class="card">
        <h2>Ship an order</h2>
        <label class="auto-detect-toggle mb-16">
          <input type="checkbox" id="auto-detect">
          <span>Auto-detect store from order number</span>
        </label>
        <label class="auto-detect-toggle mb-16">
          <input type="checkbox" id="auto-mode">
          <span>Auto Mode — weigh, rate, buy and print without clicks</span>
        </label>
        <div id="auto-preset" class="auto-preset mb-16" style="display:none">
          <div class="row">
            <div class="field" id="auto-carrier-field"><label>Carrier</label><select id="auto-carrier"></select></div>
            <div class="field" id="auto-service-field"><label>Service</label><select id="auto-service"></select></div>
            <div class="field" id="auto-service-name-field" style="display:none"><label>Service name</label><input id="auto-service-name" placeholder="e.g. UPS Ground"></div>
            <div class="field"><label>Box</label><select id="auto-box"></select></div>
          </div>
          <div class="hint mt-16" id="auto-status"></div>
        </div>
        <div class="field mb-16">
          <label>Store / Database</label>
          <select id="source-select"></select>
        </div>
        <div class="field mb-16">
          <label>Order / Invoice number <span class="hint">— scan or type, then <kbd>Enter</kbd></span></label>
          <input id="order-number" autocomplete="off" placeholder="Scan order…">
        </div>
        <div class="row">
          <div class="fixed"><button class="btn btn-primary" id="lookup-btn">Look up order</button></div>
          <div class="fixed" id="lookup-status"></div>
        </div>
      </div>
    </div>
    <div class="scan-links">
      <span id="orders-link" style="display:none">Browse open orders on the <a href="/orders.html">Orders</a> page, or create</span><span id="orders-link-alt">Create</span> a <a href="/ship.html?source=manual">manual shipment</a>.
    </div>
  </div>
  <div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal"></div></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/scan.js"></script>
</body>
</html>
