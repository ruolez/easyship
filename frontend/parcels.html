<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyShip — Parcels</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="appbar"></header>
  <div class="container wide">
    <div class="page-head"><h1>Parcels</h1><span class="sub">Every label, who created it, and where the tracking went</span></div>
    <div class="card">
      <div class="table-toolbar">
        <div class="table-summary" id="parcels-summary" style="display:none"></div>
        <div class="table-toolbar-right">
          <label class="switch">
            <input type="checkbox" id="show-size">
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-label">Box size</span>
          </label>
          <button class="btn btn-outlined btn-small" id="refresh">Refresh</button>
        </div>
      </div>
      <div class="table-wrap flush parcels-wrap">
        <table class="striped compact parcels-table">
          <thead>
            <tr>
              <th class="num col-narrow pin-num">#</th>
              <th class="sortable pin-ref" data-sort="ref">Order #</th>
              <th class="sortable col-narrow" data-sort="user">User</th>
              <th class="sortable" data-sort="store">Store</th>
              <th class="sortable" data-sort="address">Address</th>
              <th class="num sortable col-narrow" data-sort="boxes">Boxes</th>
              <th class="sortable col-narrow col-size" data-sort="size">Size (in)</th>
              <th class="num sortable col-narrow" data-sort="weight">Weight</th>
              <th class="sortable" data-sort="courier">Service</th>
              <th class="sortable" data-sort="carrier">Carrier</th>
              <th class="num sortable" data-sort="cost">Cost</th>
              <th class="sortable" data-sort="tracking">Tracking</th>
              <th class="sortable" data-sort="status">Status</th>
              <th class="sortable" data-sort="created">Created (CT)</th>
              <th class="actions"></th>
            </tr>
            <tr class="filter-row">
              <th class="pin-num"></th>
              <th class="pin-ref"><input type="text" id="search" placeholder="Search…" title="Search order #, tracking, customer, city"></th>
              <th class="narrow"><button type="button" class="filter-multi" id="user-filter"></button></th>
              <th><button type="button" class="filter-multi" id="store-filter"></button></th>
              <th></th>
              <th></th>
              <th class="col-size"><select id="size-filter"><option value="">All</option></select></th>
              <th></th>
              <th><button type="button" class="filter-multi" id="service-filter"></button></th>
              <th><button type="button" class="filter-multi" id="carrier-filter"></button></th>
              <th></th>
              <th></th>
              <th><button type="button" class="filter-multi" id="status-filter"></button></th>
              <th>
                <div class="dates">
                  <input type="date" id="date-from" title="Created from">
                  <input type="date" id="date-to" title="Created to">
                </div>
              </th>
              <th class="actions"></th>
            </tr>
          </thead>
          <tbody id="parcels-body"></tbody>
          <tfoot id="parcels-foot"></tfoot>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/browserprint.js"></script>
  <script src="/js/parcels.js"></script>
</body>
</html>
